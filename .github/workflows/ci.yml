name: ci

on:
  push:
    branches: [barua-db]
    tags: ["agent-v*"]
  pull_request:
    branches: [barua-db]

permissions:
  contents: write

jobs:
  agent:
    # Built on 22.04 so the binary's glibc also runs on newer Ubuntu boxes.
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent
      - run: cargo test
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: barua-x86_64-linux
          path: agent/target/release/barua
      - name: Attach binary to release
        if: startsWith(github.ref, 'refs/tags/agent-v')
        uses: softprops/action-gh-release@v2
        with:
          files: agent/target/release/barua

  control:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx tsc --noEmit
