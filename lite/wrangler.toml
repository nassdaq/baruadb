# barua-lite: Postgres as a function. One Durable Object per database,
# PGlite (Postgres compiled to WebAssembly) inside it, the data directory in
# the object's own storage. The control plane (control/) sends new databases
# here and moves them to a box when their numbers say so.
name = "barua-lite"
main = "src/index.ts"
compatibility_date = "2025-09-01"
workers_dev = true

[observability]
enabled = true

[vars]
# Where a busy database reports on itself (see the alarm in src/index.ts).
CONTROL_URL = "https://api.barua.app"

# Secrets (wrangler secret put <NAME>):
#   LITE_TOKEN - the one secret: callers show it to this Worker, and this
#                Worker shows it to the control plane

[[durable_objects.bindings]]
name = "DATABASE"
class_name = "Database"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Database"]

[[r2_buckets]]
binding = "HOME"
bucket_name = "barua-lite"

# PGlite ships a WebAssembly module and a filesystem image; both are bundled
# as modules so nothing is compiled from bytes at runtime.
[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = true

[[rules]]
type = "Data"
globs = ["**/*.data", "**/*.tar.gz"]
fallthrough = true
