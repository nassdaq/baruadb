name = "barua-control"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# barua.app is live on Cloudflare, so the Worker gets real names: the console
# for people, the API for programs. Both are the same Worker.
routes = [
  { pattern = "console.barua.app", custom_domain = true },
  { pattern = "api.barua.app", custom_domain = true },
]

# The dashboard: a Vite build in ui/dist, served straight from the edge. The
# Worker still owns /v1 and /health; everything else falls through to the app,
# and unknown paths return index.html so client-side routing works on reload.
[assets]
directory = "./ui/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/v1/*", "/health"]

[[d1_databases]]
binding = "DB"
database_name = "barua"
database_id = "a2a6b339-27c8-4b02-9651-9b01e9432f06"

[triggers]
crons = ["*/2 * * * *"] # mark silent boxes offline

[vars]
DB_DOMAIN = "pg.barua.app"
# How the Worker reaches a box's agent API. {box} is the box id.
AGENT_URL_TEMPLATE = "https://{box}.pg.barua.app"

# Secrets (wrangler secret put <NAME>):
#   ADMIN_TOKEN   - full access (create API keys, manage boxes)
#   JOIN_TOKEN    - lets a new box join the cluster
#   CF_API_TOKEN  - optional: Zone.DNS edit for barua.tz, for per-database DNS records
#   CF_ZONE_ID    - optional: zone id of barua.tz
